[project]
name = "codriver"
version = "0.1.0"
description = "Voice-ready in-car control panel for ROS 2: sensor health at a glance, recording and demos without a terminal"
readme = "README.md"
authors = [
    { name = "max.buettner", email = "max.buettner@hm.edu" }
]
# Ubuntu 22.04 + ROS 2 Humble ships Python 3.10, and the app has to run in the
# same interpreter that can import rclpy. Nothing here needs anything newer.
requires-python = ">=3.10"
# Deliberately empty. The backend is standard library only so it can run in the
# ROS-sourced system interpreter without a virtualenv. See README, "Why no
# dependencies".
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
codriver = "codriver.__main__:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
warn_unreachable = true
mypy_path = "src"
# Look for third-party packages in the project venv, so a mypy invoked from
# outside it still resolves pytest and the installed package.
python_executable = ".venv/bin/python"

[[tool.mypy.overrides]]
# rclpy only exists in a ROS-sourced environment; the probe imports it lazily.
module = ["rclpy.*", "rosidl_runtime_py.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
