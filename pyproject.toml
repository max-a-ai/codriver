[project]
name = "codriver"
version = "0.1.0"
description = "Voice-ready in-car control panel for ROS 2: sensor health at a glance, recording and demos without a terminal"
readme = "README.md"
authors = [
    { name = "max.buettner", email = "max.buettner@hm.edu" }
]
# Platform-constrained override of the usual 3.13 floor: Ubuntu 22.04 +
# ROS 2 Humble ships Python 3.10, and the panel has to run in the same
# interpreter that can import rclpy. Nothing here needs anything newer,
# and the upper bound only exists to keep the range honest.
requires-python = ">=3.10,<3.14"
# Deliberately empty. The backend is standard library only so it can run
# in the ROS-sourced system interpreter without a virtualenv. See README,
# "Why no dependencies".
dependencies = []

[project.scripts]
# Not app:main -- app.py holds the application state, and the CLI has
# always been __main__.
codriver = "codriver.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["codriver"]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.11",
    "pytest>=8",
]
debug = [
    "jupyter>=1.1",
    "ipywidgets>=8.1",
    "nbformat>=5.10",
    "nbclient>=0.10",
]

[tool.uv]
default-groups = ["dev", "debug"]

[tool.ruff]
line-length = 79
target-version = "py310"
src = ["."]
extend-exclude = ["third_party", "notebooks", "resources", "outputs"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "SIM",
    "RET",
    "N",
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["codriver", "tests"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

[[tool.mypy.overrides]]
# rclpy only exists in a ROS-sourced environment; the probe imports it
# lazily.
module = ["rclpy.*", "rosidl_runtime_py.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
